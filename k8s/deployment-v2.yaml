apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-app
      version: v2
  template:
    metadata:
      labels:
        app: release-app
        version: v2
    spec:
      containers:
        - name: release-app
          image: release-app:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
